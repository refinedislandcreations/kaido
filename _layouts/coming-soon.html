<!doctype html>
<html lang="en">
  <head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-MXDH7SGF');</script>
    <!-- End Google Tag Manager -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-NNSLJ3FJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'GT-NNSLJ3FJ');
    </script>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
    </title>

    <meta
      name="description"
      content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}"
    />

    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{{ '/assets/images/favicon/apple-touch-icon.png' | relative_url }}"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ '/assets/images/favicon/favicon-32x32.png' | relative_url }}"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{ '/assets/images/favicon/favicon-16x16.png' | relative_url }}"
    />

    <link
      rel="manifest"
      href="{{ '/assets/images/favicon/site.webmanifest' | relative_url }}"
    />



    <!-- Styles -->
    <link
      rel="stylesheet"
      href="{{ '/assets/css/custom-style.css' | relative_url }}?v={{ site.time | date: '%s' }}"
    />

    <link
      rel="stylesheet"
      href="{{ '/assets/css/output.css' | relative_url }}?v={{ site.time | date: '%s' }}"
    />
    <!-- Meta Pixel Code -->
    <script>
      fbq('init', '2197525264025521');
      fbq('track', 'PageView');
    </script>
  </head>

  <body class="bg-black text-white antialiased">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MXDH7SGF"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <main>{{ content }}</main>
    <script>
      // Register the service worker for caching and offline support
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register('{{ "/sw.js" | relative_url }}', {
              updateViaCache: "none",
            })
            .then(function (registration) {
              // Registration successful
              console.log(
                "ServiceWorker registration successful with scope: ",
                registration.scope,
              );
            })
            .catch(function (err) {
              console.warn("ServiceWorker registration failed: ", err);
            });
        });
      }
    </script>
  </body>
</html>
