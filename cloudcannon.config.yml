# CloudCannon CMS Configuration for Kaido

_inputs:
  title:
    type: text
    label: Title
  description:
    type: textarea
  og_image:
    type: image
    label: Social Preview Image
  background_image:
    type: image
    label: Background Image
  button_text:
    type: text
    label: Button Text
  button_url:
    type: text
    label: Button URL
  eyebrow:
    type: text
    label: Eyebrow
  subtitle:
    type: text
    label: Subtitle
  url:
    type: image
    label: Image URL
  icon:
    type: text
    label: Icon Name
  theme:
    type: select
    options:
      values:
        - dark
        - light
  footer_quote:
    type: text
    label: Footer Quote
  paragraphs:
    type: array

_structures:
  stats:
    values:
      - value:
          eyebrow: ""
          title: ""
  categories:
    values:
      - value:
          title: ""
          items: []
  spec_items:
    values:
      - value:
          title: ""
          value: ""
          icon: ""
  side_specs:
    values:
      - value:
          label: ""
          value: ""
  gallery_images:
    values:
      - value:
          url: ""
          eyebrow: ""
          title: ""
          description: ""
  maintenance_right_items:
    values:
      - value:
          title: ""
          frequency: ""

collections_config:
  data:
    path: _data
    icon: "badge"

collection_groups:
  - heading: Pages
    collections:
      - pages
      - posts

paths:
  dam: assets/images
  uploads: assets/images/uploads

_outputs:
  subtitle: html
  description: html
